<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘 할 일 작성기</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="topline">
        <p class="eyebrow">USAGI'S LITTLE DAYS</p>
        <a class="weather-badge" href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer" aria-label="서울 날씨 · 제공: Open-Meteo">
          <span id="weather-icon" class="weather-icon" aria-hidden="true">◌</span>
          <span id="weather-status" role="status" aria-live="polite">불러오는 중…</span>
        </a>
      </div>
      <div class="mascot" aria-hidden="true">
        <span class="doodle doodle-left">✳</span>
        <span class="mascot-bubble">야하~!</span>
        <img src="assets/usagi.png" alt="" width="174" height="174">
        <span class="doodle doodle-right">♡</span>
        <span class="little-note">하나씩, 천천히!</span>
      </div>
      <h1>오늘 할 일</h1>
      <p class="subtitle">우사기와 함께, 오늘도 사부작사부작</p>
      <p id="remaining" class="remaining" aria-live="polite">남은 할 일 0개</p>
    </header>

    <form id="todo-form" novalidate>
      <label for="todo-input" class="sr-only">새 할 일</label>
      <div class="input-row">
        <input
          id="todo-input"
          type="text"
          maxlength="100"
          placeholder="작은 할 일 하나 적어볼까?"
          autocomplete="off"
          autofocus
        >
        <button type="submit" class="add-button"><span aria-hidden="true">＋</span> 추가</button>
      </div>
      <p id="input-error" class="error" role="alert" aria-live="assertive"></p>
    </form>

    <div class="list-heading"><span>나의 작은 체크리스트</span><span aria-hidden="true">✿</span></div>
    <ul id="todo-list" class="todo-list" aria-label="할 일 목록"></ul>
    <p id="empty-message" class="empty-message"><span class="empty-flower" aria-hidden="true">✿</span>무엇부터 해볼까?<br><span class="empty-hint">작은 할 일 하나부터 적어 봐요.</span></p>
    <section class="news-section" aria-labelledby="news-title">
      <div class="news-heading">
        <div><h2 id="news-title">오늘의 IT 뉴스</h2><p>새로운 기술 소식, 한 번에 5개</p></div>
        <button id="news-refresh" type="button">새로고침</button>
      </div>
      <div class="news-tabs" role="group" aria-label="뉴스 보기">
        <button id="news-latest" type="button" aria-pressed="true">최신 뉴스</button>
        <button id="news-saved" type="button" aria-pressed="false">저장한 기사 (0)</button>
      </div>
      <p id="news-status" class="news-status" role="status" aria-live="polite">뉴스를 불러오는 중…</p>
      <div class="news-permission-actions">
        <button id="news-permission" class="news-save" type="button" hidden>뉴스 접근 허용</button>
        <button id="news-restart" class="news-save" type="button" hidden>확장 다시 시작</button>
      </div>
      <p id="news-storage-error" class="error" role="alert" hidden></p>
      <ul id="news-list" class="news-list" aria-label="IT 뉴스 목록"></ul>
      <p class="news-source">출처: <a href="https://news.hada.io/" target="_blank" rel="noopener noreferrer">GeekNews</a> · 소개는 RSS 제공 내용입니다.</p>
    </section>
    <footer class="footer-note">오늘의 나에게 작은 칭찬 하나 <span aria-hidden="true">✦</span></footer>
  </main>

  <script src="popup.js"></script>
  <script src="news.js"></script>
</body>
</html>
