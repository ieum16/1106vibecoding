<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>교육 시간표 · 메모</title><link rel="stylesheet" href="popup.css"><script src="education-core.js" defer></script><script src="profile.js" defer></script><script src="popup.js" defer></script><link rel="stylesheet" href="notes.css"><link rel="stylesheet" href="popup-summary.css"><script src="notes-core.js" defer></script><script src="notes-ui.js" defer></script><link rel="stylesheet" href="polish.css"></head>
<body class="popup-view">
  <header class="header-welcome"><h1 id="popup-greeting">교육생님, 반가워요.</h1></header>
  <section class="lesson-summary" aria-label="오늘의 교육 시간">
    <div class="lesson-summary-heading"><h2>교육 시간</h2><span id="popup-lesson-state" role="status">불러오는 중</span></div>
    <p class="lesson-name-label">수업명</p><p id="popup-lesson-title">시간표를 확인하고 있습니다.</p>
    <dl class="lesson-summary-times"><div><dt>수업 시작(min)</dt><dd id="popup-lesson-start">--:--</dd></div><div><dt>종료 시간(max)</dt><dd id="popup-lesson-end">--:--</dd></div><div><dt>남은 시간</dt><dd id="popup-lesson-remaining" role="timer" aria-label="수업 남은 시간">--:--:--</dd></div></dl>
    <p id="popup-lesson-hint">오늘 날짜 · 컴퓨터 시간 기준</p>
  </section>
  <section id="notes-panel" aria-label="메모 목록" data-popup="true"></section>
  <button id="open">전체 대시보드 열기 ↗</button>
</body>
</html>
