<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 할일!</title>
<style>
  /* 빗썸고딕 (SIL OFL) — 확장 프로그램 안에 포함되어 인터넷 없이도 보임 */
  @font-face { font-family: "Bithumb Gothic Original"; src: url("fonts/BithumbGothic-Original.woff2") format("woff2"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "Bithumb Gothic Basic"; src: url("fonts/BithumbGothic-Basic.woff2") format("woff2"); font-weight: 700; font-display: swap; }
  :root {
    --sky: #6ec3f4;
    --sky-deep: #3d9be0;
    --cloud: #ffffff;
    --wood: #b8743a;
    --wood-dark: #7a4419;
    --ink: #1b1b1b;
    --paper: #fffdf5;
    --yellow: #ffd23f;
    --red: #e2392f;
    --green: #2f9e57;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Bithumb Gothic Basic", sans-serif;
    font-weight: 700;
    color: var(--ink);
    background: var(--sky) url("img/room-bg.jpg") center bottom / auto 100% repeat-x fixed;
  }

  /* 나무 간판 */
  header { text-align: center; padding: 28px 16px 8px; }
  .sign {
    display: inline-block;
    padding: 14px 34px 10px;
    background: repeating-linear-gradient(0deg, var(--wood) 0 14px, #a8652e 14px 16px);
    border: 5px solid var(--wood-dark);
    border-radius: 12px;
    box-shadow: 0 8px 0 var(--wood-dark), 0 14px 24px rgba(0,0,0,.25);
    transform: rotate(-2deg);
  }
  .sign small {
    display: block;
    font-family: "Bithumb Gothic Original", sans-serif;
    color: var(--yellow);
    font-size: 15px;
    letter-spacing: 3px;
    text-shadow: 2px 2px 0 var(--wood-dark);
  }
  .sign h1 {
    margin: 0;
    font-family: "Bithumb Gothic Original", sans-serif;
    font-weight: 700;
    font-size: clamp(30px, 6vw, 46px);
    color: #fff;
    -webkit-text-stroke: 2px var(--wood-dark);
    text-shadow: 3px 3px 0 var(--wood-dark);
  }

  main {
    max-width: 1040px;
    margin: 0 auto;
    padding: 20px 16px 48px;
    display: grid;
    grid-template-columns: 1fr 1.1fr;
    gap: 24px;
    align-items: start;
  }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }

  /* 웹툰 컷 */
  .panel {
    background: var(--paper);
    border: 4px solid var(--ink);
    border-radius: 6px;
    box-shadow: 8px 8px 0 var(--ink);
    position: relative;
  }

  /* 캐릭터 무대: 실패를 지우는 밤 칠판 */
  .stage {
    padding: 22px 18px 0;
    overflow: hidden;
    background: #10281f;
    position: sticky;
    top: 16px;
  }
  .scene {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 50% 72%, rgba(255, 214, 110, .34), transparent 26%),
      radial-gradient(circle at 12% 18%, rgba(255,255,255,.12), transparent 16%),
      radial-gradient(circle at 88% 30%, rgba(120, 220, 170, .16), transparent 18%),
      repeating-linear-gradient(180deg, transparent 0 31px, rgba(255,255,255,.045) 32px),
      linear-gradient(165deg, #246047 0%, #123528 46%, #071610 100%);
  }
  .scene::before {
    content: "";
    position: absolute;
    inset: -20%;
    background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.05) 0 2deg, transparent 2deg 18deg);
    animation: spin-lines 36s linear infinite;
    opacity: .35;
  }
  .chalk-ban, .chalk-mark, .spark {
    position: absolute;
    font-family: "Bithumb Gothic Original", sans-serif;
  }
  .chalk-ban {
    right: 7%;
    top: 46%;
    color: rgba(255,255,255,.2);
    font-size: 58px;
    letter-spacing: -0.04em;
    transform: rotate(-11deg);
    text-decoration: line-through;
    text-decoration-thickness: 5px;
    text-decoration-color: rgba(226, 57, 47, .85);
  }
  .chalk-mark {
    left: 8%;
    top: 54%;
    color: rgba(255, 210, 74, .72);
    font-size: 78px;
    text-shadow: 0 0 12px rgba(255, 210, 74, .45);
    animation: chalk-bob 5.5s ease-in-out infinite;
  }
  .spark {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 8px #fff;
    animation: chalk-float 7s linear infinite;
  }
  .spark.s1 { left: 18%; top: 70%; animation-duration: 6.2s; }
  .spark.s2 { left: 62%; top: 78%; animation-duration: 8s; animation-delay: -2s; }
  .spark.s3 { left: 78%; top: 58%; width: 3px; height: 3px; animation-duration: 5.4s; animation-delay: -1s; }
  .spark.s4 { left: 34%; top: 64%; animation-duration: 9s; animation-delay: -3s; }
  .stage::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 16px;
    z-index: 4;
    background: repeating-linear-gradient(90deg, #6a3d22 0 10px, #c48955 10px 18px, #4e2c16 18px 26px);
    border-top: 3px solid var(--ink);
  }
  @media (max-width: 820px) { .stage { position: relative; top: 0; } }

  .bubble {
    position: relative;
    background: #fff;
    border: 4px solid var(--ink);
    border-radius: 42px;
    padding: 22px 24px;
    font-size: clamp(20px, 2.6vw, 25px);
    line-height: 1.45;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    word-break: keep-all;
    box-shadow: 4px 4px 0 rgba(0,0,0,.15);
    z-index: 2;
  }
  .bubble::after, .bubble::before {
    content: "";
    position: absolute;
    left: 50%;
    border-style: solid;
  }
  .bubble::before { /* 꼬리 테두리 */
    bottom: -30px;
    margin-left: -8px;
    border-width: 30px 22px 0 0;
    border-color: var(--ink) transparent transparent transparent;
  }
  .bubble::after { /* 꼬리 안쪽 */
    bottom: -21px;
    margin-left: -3px;
    border-width: 22px 14px 0 0;
    border-color: #fff transparent transparent transparent;
  }
  .bubble.shout { /* 칭찬할 때: 뾰족한 외침 말풍선 느낌 */
    background: var(--yellow);
    border-radius: 18px;
    animation: shake .4s;
  }
  .bubble.shout::after { border-color: var(--yellow) transparent transparent transparent; }
  .bubble b { color: var(--red); }
  .bubble { flex-direction: column; gap: 8px; }
  .catchphrase {
    display: block;
    color: #86221a;
    font-size: clamp(16px, 3.4vw, 22px);
  }
  .bubble.shout .catchphrase {
    animation: catchphrase-pop .65s .12s both;
  }
  @keyframes catchphrase-pop {
    0% { opacity: 0; transform: translateY(10px) scale(.88); }
    55% { opacity: 1; transform: translateY(-4px) scale(1.08); }
    100% { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bubble.shout, .bubble.shout .catchphrase, .woody.talk, .woody.cheer, .sfx.pop {
      animation: none;
    }
  }

  .char-wrap { position: relative; z-index: 2; display: flex; justify-content: center; margin-top: 36px; }
  .char-wrap { height: 330px; align-items: flex-end; }
  .woody {
    height: 320px; width: auto; display: block;
    transform-origin: bottom center;
    filter: drop-shadow(4px 4px 0 rgba(0,0,0,.25));
    margin-bottom: -4px;
  }
  .woody.closeup { height: 340px; margin-bottom: -26px; }   /* 칭찬 컷은 가까이 */
  .woody.talk { animation: bob .5s ease-in-out 2; }
  .woody.cheer { animation: jump .6s ease-out 2; }

  /* 효과음 글자 */
  .sfx {
    position: absolute;
    font-family: "Bithumb Gothic Original", sans-serif;
    font-size: 54px;
    color: var(--red);
    -webkit-text-stroke: 3px var(--ink);
    pointer-events: none;
    opacity: 0;
    z-index: 3;
  }
  .sfx.pop { animation: sfx 1s ease-out forwards; }


  /* 할 일 목록 */
  .board { padding: 20px; }
  .board h2 {
    margin: 0 0 14px;
    font-family: "Bithumb Gothic Original", sans-serif; font-weight: 700;
    font-size: 26px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .badge {
    font-family: "Bithumb Gothic Basic", sans-serif; font-size: 16px;
    background: var(--yellow); border: 3px solid var(--ink); border-radius: 30px;
    padding: 3px 12px;
  }
  form { display: flex; gap: 8px; margin-bottom: 18px; }
  form input {
    flex: 1; min-width: 0;
    font: inherit; font-size: 19px;
    padding: 12px 14px;
    border: 3px solid var(--ink); border-radius: 10px;
    background: #fff;
  }
  form input:focus { outline: 3px solid var(--sky-deep); outline-offset: 1px; }
  .btn {
    font: inherit; font-size: 18px;
    border: 3px solid var(--ink); border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform .08s, box-shadow .08s;
    white-space: nowrap;
  }
  .btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  .btn-add { background: var(--red); color: #fff; }
  .btn-ok { background: var(--green); color: #fff; }
  .btn-undo { background: #fff; font-size: 15px; padding: 7px 10px; }

  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
  li {
    display: flex; align-items: center; gap: 10px;
  }
  .mini {
    width: 46px; height: 46px; flex: none;
    border: 3px solid var(--ink); border-radius: 50%;
    background: var(--sky); overflow: hidden;
  }
  .mini svg, .mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .item-bubble {
    position: relative; flex: 1; min-width: 0;
    background: #fff;
    border: 3px solid var(--ink); border-radius: 18px;
    padding: 10px 14px;
    font-size: 18px;
    cursor: pointer;
    word-break: break-all;
  }
  .item-bubble::before {
    content: ""; position: absolute; left: -13px; top: 14px;
    border-style: solid; border-width: 8px 13px 8px 0;
    border-color: transparent var(--ink) transparent transparent;
  }
  .item-bubble::after {
    content: ""; position: absolute; left: -8px; top: 17px;
    border-style: solid; border-width: 5px 8px 5px 0;
    border-color: transparent #fff transparent transparent;
  }
  .item-bubble:hover { background: #f3fbff; }
  .item-bubble:hover::after { border-right-color: #f3fbff; }
  li.done .item-bubble { background: #eaf7ee; color: #6b7a70; text-decoration: line-through; }
  li.done .item-bubble::after { border-right-color: #eaf7ee; }
  .stamp {
    position: absolute; right: -6px; top: -14px;
    font-size: 13px; color: var(--red);
    border: 2px solid var(--red); border-radius: 6px;
    padding: 1px 6px; background: #fff;
    transform: rotate(10deg);
    text-decoration: none; display: inline-block;
  }
  .del {
    background: none; border: none; cursor: pointer;
    font-size: 20px; color: #999; padding: 4px;
  }
  .del:hover { color: var(--red); }
  .empty { text-align: center; color: #777; padding: 24px 0 8px; font-size: 18px; }

  @keyframes chalk-bob { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-10px) rotate(4deg); } }
  @keyframes chalk-float { 0% { transform: translateY(12px); opacity: 0; } 20% { opacity: .8; } 100% { transform: translateY(-90px); opacity: 0; } }
  @keyframes spin-lines { to { transform: rotate(360deg); } }
  @keyframes bob { 0%,100% { transform: rotate(0) } 25% { transform: rotate(-3deg) } 75% { transform: rotate(3deg) } }
  @keyframes jump { 0%,100% { transform: translateY(0) } 40% { transform: translateY(-28px) scale(1.04) } }
  @keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-6px) rotate(-1deg) } 75% { transform: translateX(6px) rotate(1deg) } }
  @keyframes sfx { 0% { opacity: 0; transform: scale(.3) rotate(-15deg) } 30% { opacity: 1; transform: scale(1.2) rotate(-8deg) } 100% { opacity: 0; transform: scale(1) translateY(-40px) rotate(-8deg) } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  /* 확장 프로그램 팝업 (가로 400px 안에 맞춤) */
  .open-full {
    position: absolute; right: 12px; top: 12px; z-index: 5;
    font: inherit; font-size: 13px;
    background: #fff; border: 2px solid var(--ink); border-radius: 20px;
    padding: 4px 10px; cursor: pointer; display: none;
  }
  html.popup .open-full { display: block; }
  html.popup body { width: 400px; }
  html.popup header { padding: 14px 12px 0; position: relative; }
  html.popup .sign { padding: 8px 18px 6px; transform: rotate(-1.5deg); }
  html.popup .sign small { font-size: 11px; }
  html.popup .sign h1 { font-size: 24px; }
  html.popup main { grid-template-columns: 1fr; gap: 14px; padding: 12px 12px 18px; }
  html.popup .stage { position: relative; top: 0; min-height: 0; padding: 14px 12px 0; box-shadow: 5px 5px 0 var(--ink); }
  html.popup .bubble { font-size: 18px; min-height: 76px; padding: 14px 16px; border-radius: 30px; }
  html.popup .catchphrase { font-size: 15px; }
  html.popup .char-wrap { height: 190px; margin-top: 22px; }
  html.popup .woody { height: 186px; }
  html.popup .woody.closeup { height: 200px; margin-bottom: -18px; }
  html.popup body { background-size: auto 600px; }
  html.popup .sfx { font-size: 38px; }
  html.popup #sfx { top: 110px !important; }
  html.popup #sfx2 { top: 140px !important; }
  html.popup .board { padding: 14px; box-shadow: 5px 5px 0 var(--ink); }
  html.popup .board h2 { font-size: 21px; }
  html.popup form input { font-size: 16px; padding: 9px 10px; }
  html.popup .btn { font-size: 16px; padding: 8px 12px; }
  html.popup .btn-undo { font-size: 13px; padding: 6px 8px; }
  html.popup .item-bubble { font-size: 16px; padding: 8px 12px; }
  html.popup .mini { width: 38px; height: 38px; }
</style>
</head>
<body>

<header>
  <button class="open-full" id="openFull" type="button">↗ 크게 보기</button>
  <div class="sign">
    <small>SHERIFF'S LIST</small>
    <h1>오늘의 할일!</h1>
  </div>
</header>

<main>
  <!-- 캐릭터 컷 -->
  <section class="panel stage" aria-live="polite">
    <div class="scene" aria-hidden="true">
      <div class="chalk-ban">실패</div>
      <div class="chalk-mark">✓</div>
      <i class="spark s1"></i>
      <i class="spark s2"></i>
      <i class="spark s3"></i>
      <i class="spark s4"></i>
    </div>
    <div class="bubble" id="bubble">
      <span id="bubbleText">안녕하세요!</span>
      <strong class="catchphrase">저는 실패하지 않습니다</strong>
    </div>
    <div class="sfx" id="sfx" style="left:18px; top:150px;">팡!</div>
    <div class="sfx" id="sfx2" style="right:24px; top:210px; color:var(--yellow);">★</div>
    <div class="char-wrap">
      <img id="woody" class="woody" src="img/sujeong-stand.png" alt="계수정 선생님">
    </div>
  </section>

  <!-- 할 일 컷 -->
  <section class="panel board">
    <h2>오늘의 임무 <span class="badge" id="count">0 / 0</span></h2>
    <form id="form" autocomplete="off">
      <input id="input" placeholder="할 일을 적어줘, 파트너!" maxlength="60">
      <button class="btn btn-add" type="submit">추가</button>
    </form>
    <ul id="list"></ul>
    <p class="empty" id="empty">아직 할 일이 없어. 하나 적어볼까?</p>
  </section>
</main>

<script src="popup.js"></script>
</body>
</html>
