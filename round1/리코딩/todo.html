<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포켓몬 할 일 도감</title>
<style>
  /* 빗썸고딕 (SIL OFL) — 확장 프로그램 안에 포함되어 인터넷 없이도 보임 */
  @font-face { font-family: "Bithumb Gothic Original"; src: url("fonts/BithumbGothic-Original.woff2") format("woff2"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "Bithumb Gothic Basic"; src: url("fonts/BithumbGothic-Basic.woff2") format("woff2"); font-weight: 700; font-display: swap; }
  :root {
    --sky: #6ec3f4;
    --sky-deep: #3d9be0;
    --cloud: #ffffff;
    --wood: #ef4444;
    --wood-dark: #243b65;
    --ink: #243b65;
    --paper: #fffdf5;
    --yellow: #ffd23f;
    --red: #e2392f;
    --green: #2f9e57;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Bithumb Gothic Basic", sans-serif;
    font-weight: 700;
    color: var(--ink);
    background: radial-gradient(ellipse at 12% 15%, #fff 0 5%, transparent 5.2%), radial-gradient(ellipse at 88% 30%, #ffffffaa 0 7%, transparent 7.2%), linear-gradient(180deg, #bce9ff 0%, #e9f8ff 65%, #d6efb2 100%);
    background-attachment: fixed;
  }

  /* 포켓몬 퀘스트 간판 */
  header { text-align: center; padding: 28px 16px 8px; }
  .sign {
    display: inline-block;
    padding: 14px 34px 10px;
    background: linear-gradient(180deg, #ef4444 0 49%, #243b65 49% 54%, #fff 54%);
    border: 5px solid var(--wood-dark);
    border-radius: 12px;
    box-shadow: 0 8px 0 var(--wood-dark), 0 14px 24px rgba(0,0,0,.25);
    transform: rotate(-2deg);
  }
  .sign small {
    display: block;
    font-family: "Bithumb Gothic Original", sans-serif;
    color: var(--yellow);
    font-size: 15px;
    letter-spacing: 3px;
    text-shadow: 2px 2px 0 var(--wood-dark);
  }
  .sign h1 {
    margin: 0;
    font-family: "Bithumb Gothic Original", sans-serif;
    font-weight: 700;
    font-size: clamp(30px, 6vw, 46px);
    color: #fff;
    -webkit-text-stroke: 2px var(--wood-dark);
    text-shadow: 3px 3px 0 var(--wood-dark);
  }

  main {
    max-width: 1040px;
    margin: 0 auto;
    padding: 20px 16px 48px;
    display: grid;
    grid-template-columns: 1fr 1.1fr;
    gap: 24px;
    align-items: start;
  }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }

  /* 웹툰 컷 */
  .panel {
    background: var(--paper);
    border: 4px solid var(--ink);
    border-radius: 6px;
    box-shadow: 8px 8px 0 var(--ink);
    position: relative;
  }

  /* 캐릭터 무대 */
  .stage {
    padding: 22px 18px 0;
    overflow: hidden;
    background-color: #fff3c4;
    background-image: radial-gradient(rgba(0,0,0,.13) 1.6px, transparent 1.8px);
    background-size: 12px 12px;
    position: sticky;
    top: 16px;
  }
  @media (max-width: 820px) { .stage { position: relative; top: 0; } }

  .bubble {
    position: relative;
    background: #fff;
    border: 4px solid var(--ink);
    border-radius: 42px;
    padding: 22px 24px;
    font-size: clamp(20px, 2.6vw, 25px);
    line-height: 1.45;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    word-break: keep-all;
    overflow-wrap: anywhere;
    box-shadow: 4px 4px 0 rgba(0,0,0,.15);
    z-index: 2;
  }
  .bubble::after, .bubble::before {
    content: "";
    position: absolute;
    left: 50%;
    border-style: solid;
  }
  .bubble::before { /* 꼬리 테두리 */
    bottom: -30px;
    margin-left: -8px;
    border-width: 30px 22px 0 0;
    border-color: var(--ink) transparent transparent transparent;
  }
  .bubble::after { /* 꼬리 안쪽 */
    bottom: -21px;
    margin-left: -3px;
    border-width: 22px 14px 0 0;
    border-color: #fff transparent transparent transparent;
  }
  .bubble.shout { /* 칭찬할 때: 뾰족한 외침 말풍선 느낌 */
    background: var(--yellow);
    border-radius: 18px;
    animation: shake .4s;
  }
  .bubble.shout::after { border-color: var(--yellow) transparent transparent transparent; }
  .bubble b { color: var(--red); }

  .char-wrap { position: relative; display: flex; justify-content: center; margin-top: 36px; }
  .char-wrap { height: 330px; align-items: flex-end; }
  .partner-picker { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
  .partner-choice { font: inherit; border: 2px solid var(--ink); border-radius: 12px; padding: 6px 3px; background: #fff; cursor: pointer; color: var(--ink); min-width: 0; }
  .partner-choice[aria-pressed="true"] { background: var(--yellow); box-shadow: 0 3px 0 var(--ink); }
  .partner-choice img { display: block; width: 52px; height: 52px; object-fit: contain; margin: auto; }
  .partner-choice span { display: block; font-size: 13px; }
  .growth { background: #ffffffed; border: 2px solid var(--ink); border-radius: 14px; padding: 12px; margin: 14px 0; }
  .growth-title { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .growth progress { width: 100%; height: 14px; margin-top: 8px; accent-color: #40975b; }
  .growth p { margin: 5px 0 0; font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
  .growth details { margin-top: 8px; font-size: 12px; }
  .growth summary { cursor: pointer; }
  .evolution-path { display: flex; justify-content: center; align-items: center; gap: 4px; margin-top: 8px; }
  .evolution-form { text-align: center; font-size: 11px; flex: 1; min-width: 0; }
  .evolution-form img { width: 50px; height: 50px; object-fit: contain; display: block; margin: auto; }
  .evolution-form.locked { opacity: .45; }
  .evolution-form.current { color: #20753b; }
  .resize-handle { display: none; }
  .resize-edge { display: none; }
  html.popup .resize-edge { display: block; position: fixed; z-index: 19; border: 0; padding: 0; background: transparent; touch-action: none; }
  html.popup .resize-bottom { bottom: 0; left: 0; width: calc(100% - 25px); height: 9px; cursor: ns-resize; border-bottom: 3px solid #243b65; }
  html.popup .resize-right { right: 0; top: 0; width: 7px; height: calc(100% - 25px); cursor: ew-resize; }
  html.popup .resize-edge:hover, html.popup .resize-edge:focus-visible { background: #6ec3f4; }
  html.popup { overflow: hidden; }
  html.popup body { overflow: auto; min-height: 0; }
  html.popup .resize-handle { display: block; position: fixed; bottom: 0; right: 0; width: 25px; height: 25px; z-index: 20; border: 0; border-radius: 8px 0 0; background: #243b65; color: #fff; cursor: nwse-resize; touch-action: none; font-size: 20px; padding: 0; }
  .pikachu {
    height: 320px; max-width: 100%; width: auto; object-fit: contain; display: block;
    transform-origin: bottom center;
    filter: drop-shadow(4px 4px 0 rgba(0,0,0,.25));
    margin-bottom: -4px;
  }
  .pikachu.closeup { height: 320px; margin-bottom: -4px; }
  .pikachu.talk { animation: bob .5s ease-in-out 2; }
  .pikachu.cheer { animation: jump .6s ease-out 2; }

  /* 효과음 글자 */
  .sfx {
    position: absolute;
    font-family: "Bithumb Gothic Original", sans-serif;
    font-size: 54px;
    color: var(--red);
    -webkit-text-stroke: 3px var(--ink);
    pointer-events: none;
    opacity: 0;
    z-index: 3;
  }
  .sfx.pop { animation: sfx 1s ease-out forwards; }


  /* 할 일 목록 */
  .board { padding: 20px; }
  .board h2 {
    margin: 0 0 14px;
    font-family: "Bithumb Gothic Original", sans-serif; font-weight: 700;
    font-size: 26px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .badge {
    font-family: "Bithumb Gothic Basic", sans-serif; font-size: 16px;
    background: var(--yellow); border: 3px solid var(--ink); border-radius: 30px;
    padding: 3px 12px;
  }
  form { display: flex; gap: 8px; margin-bottom: 18px; }
  form input {
    flex: 1; min-width: 0;
    font: inherit; font-size: 19px;
    padding: 12px 14px;
    border: 3px solid var(--ink); border-radius: 10px;
    background: #fff;
  }
  form input:focus { outline: 3px solid var(--sky-deep); outline-offset: 1px; }
  .btn {
    font: inherit; font-size: 18px;
    border: 3px solid var(--ink); border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform .08s, box-shadow .08s;
    white-space: nowrap;
  }
  .btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  .bulk-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
  .btn-clear { background: #fff; color: #b42318; font-size: 15px; }
  .btn:disabled { opacity: .4; cursor: default; box-shadow: none; }
  .btn:focus-visible { outline: 3px solid var(--sky-deep); outline-offset: 3px; }
  .status { color: #b42318; font-size: 14px; overflow-wrap: anywhere; }
  main > *, li { min-width: 0; }
  .btn-add { background: var(--red); color: #fff; }
  .btn-ok { background: var(--green); color: #fff; }
  .btn-undo { background: #fff; font-size: 15px; padding: 7px 10px; }

  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
  li {
    display: flex; align-items: center; gap: 10px;
  }
  .mini {
    width: 46px; height: 46px; flex: none;
    border: 3px solid var(--ink); border-radius: 50%;
    background: var(--sky); overflow: hidden;
  }
  .mini svg, .mini img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .item-bubble {
    position: relative; flex: 1; min-width: 0;
    background: #fff;
    border: 3px solid var(--ink); border-radius: 18px;
    padding: 10px 14px;
    font-size: 18px;
    cursor: pointer;
    word-break: break-all;
  }
  .item-bubble::before {
    content: ""; position: absolute; left: -13px; top: 14px;
    border-style: solid; border-width: 8px 13px 8px 0;
    border-color: transparent var(--ink) transparent transparent;
  }
  .item-bubble::after {
    content: ""; position: absolute; left: -8px; top: 17px;
    border-style: solid; border-width: 5px 8px 5px 0;
    border-color: transparent #fff transparent transparent;
  }
  .item-bubble:hover { background: #f3fbff; }
  .item-bubble:hover::after { border-right-color: #f3fbff; }
  li.done .item-bubble { background: #eaf7ee; color: #6b7a70; text-decoration: line-through; }
  li.done .item-bubble::after { border-right-color: #eaf7ee; }
  .stamp {
    position: absolute; right: -6px; top: -14px;
    font-size: 13px; color: var(--red);
    border: 2px solid var(--red); border-radius: 6px;
    padding: 1px 6px; background: #fff;
    transform: rotate(10deg);
    text-decoration: none; display: inline-block;
  }
  .del {
    background: none; border: none; cursor: pointer;
    font-size: 20px; color: #999; padding: 4px;
  }
  .del:hover { color: var(--red); }
  .empty { text-align: center; color: #777; padding: 24px 0 8px; font-size: 18px; }

  @keyframes bob { 0%,100% { transform: rotate(0) } 25% { transform: rotate(-3deg) } 75% { transform: rotate(3deg) } }
  @keyframes jump { 0%,100% { transform: translateY(0) } 40% { transform: translateY(-28px) scale(1.04) } }
  @keyframes shake { 0%,100% { transform: translateX(0) } 25% { transform: translateX(-6px) rotate(-1deg) } 75% { transform: translateX(6px) rotate(1deg) } }
  @keyframes sfx { 0% { opacity: 0; transform: scale(.3) rotate(-15deg) } 30% { opacity: 1; transform: scale(1.2) rotate(-8deg) } 100% { opacity: 0; transform: scale(1) translateY(-40px) rotate(-8deg) } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  /* 확장 프로그램 팝업 (가로 400px 안에 맞춤) */
  .open-full {
    position: absolute; right: 12px; top: 12px; z-index: 5;
    font: inherit; font-size: 13px;
    background: #fff; border: 2px solid var(--ink); border-radius: 20px;
    padding: 4px 10px; cursor: pointer; display: none;
  }
  html.popup .open-full { display: block; }
  html.popup body { width: 400px; }
  html.popup header { padding: 14px 12px 0; position: relative; }
  html.popup .sign { padding: 8px 18px 6px; transform: rotate(-1.5deg); }
  html.popup .sign small { font-size: 11px; }
  html.popup .sign h1 { font-size: 24px; }
  html.popup main { grid-template-columns: 1fr; gap: 14px; padding: 12px 12px 30px; }
  @media (min-width: 650px) { html.popup main { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); } }
  html.popup .stage { position: relative; top: 0; min-height: 0; padding: 12px; box-shadow: 5px 5px 0 var(--ink); display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 10px; align-items: center; }
  html.popup .partner-picker { grid-column: 1 / -1; margin: 0; }
  html.popup .partner-choice img { width: 36px; height: 36px; }
  html.popup .partner-choice span { font-size: 12px; }
  html.popup .bubble { grid-column: 2; grid-row: 2; }
  html.popup .bubble::before, html.popup .bubble::after { display: none; }
  html.popup .growth { grid-column: 1 / -1; margin: 0; padding: 10px; }
  html.popup .bubble { font-size: 15px; min-height: 76px; max-height: 120px; overflow-y: auto; padding: 10px; border-radius: 20px; }
  html.popup .char-wrap { grid-column: 1; grid-row: 2; height: 110px; margin-top: 0; align-items: center; }
  html.popup .pikachu { height: 108px; margin-bottom: 0; }
  html.popup .pikachu.closeup { height: 108px; margin-bottom: 0; }
  html.popup body { background-size: auto 600px; }
  html.popup .sfx { font-size: 38px; }
  html.popup #sfx { top: 110px !important; }
  html.popup #sfx2 { top: 140px !important; }
  html.popup .board { padding: 14px; box-shadow: 5px 5px 0 var(--ink); }
  html.popup .board h2 { font-size: 21px; }
  html.popup form input { font-size: 16px; padding: 9px 10px; }
  html.popup .btn { font-size: 16px; padding: 8px 12px; }
  html.popup .btn-undo { font-size: 13px; padding: 6px 8px; }
  html.popup .item-bubble { font-size: 16px; padding: 8px 12px; }
  html.popup .mini { width: 38px; height: 38px; }
</style>
</head>
<body>

<header>
  <button class="open-full" id="openFull" type="button">↗ 크게 보기</button>
  <div class="sign">
    <small>POKÉMON QUEST</small>
    <h1>포켓몬 할 일 도감</h1>
  </div>
</header>

<main>
  <!-- 캐릭터 컷 -->
  <section class="panel stage" aria-live="polite">
    <div class="partner-picker" role="group" aria-label="함께할 포켓몬 선택">
      <button class="partner-choice" type="button" data-partner="pikachu" aria-pressed="true"><img src="img/pokemon-025.png" alt=""><span>피카츄</span><span id="level-pikachu">Lv.1</span></button>
      <button class="partner-choice" type="button" data-partner="charmander" aria-pressed="false"><img src="img/pokemon-004.png" alt=""><span>파이리</span><span id="level-charmander">Lv.1</span></button>
      <button class="partner-choice" type="button" data-partner="squirtle" aria-pressed="false"><img src="img/pokemon-007.png" alt=""><span>꼬부기</span><span id="level-squirtle">Lv.1</span></button>
    </div>
    <div class="bubble" id="bubble"><span id="bubbleText">피카피카! 함께 시작하자!</span></div>
    <div class="sfx" id="sfx" style="left:18px; top:150px;">찌릿!</div>
    <div class="sfx" id="sfx2" style="right:24px; top:210px; color:var(--yellow);">★</div>
    <div class="char-wrap">
      <img id="pikachu" class="pikachu" src="img/pikachu-official.png" alt="응원하는 피카츄">
    </div>
    <div class="growth">
      <div class="growth-title"><strong id="partnerName">피카츄</strong><span id="partnerLevel">Lv.1</span></div>
      <progress id="xpBar" value="0" max="50" aria-label="다음 레벨까지 경험치"></progress>
      <p id="xpText"></p><p id="evolutionHint"></p>
      <details>
        <summary>진화 단계와 성장 규칙</summary>
        <div class="evolution-path" id="evolutionPath" aria-label="진화 단계"></div>
        <p>완료 +10 XP · 50 XP마다 레벨 업<br>완료 취소 시 원래 포켓몬의 XP 회수 · 목록 삭제 시 성장 유지<br>진화 레벨은 이 앱만의 규칙이에요.</p>
      </details>
    </div>
  </section>

  <!-- 할 일 컷 -->
  <section class="panel board">
    <h2>오늘의 퀘스트 <span class="badge" id="count">0 / 0</span></h2>
    <form id="form" autocomplete="off">
      <input id="input" placeholder="오늘의 퀘스트를 입력해 줘!" maxlength="60">
      <button class="btn btn-add" type="submit">추가</button>
    </form>
    <ul id="list"></ul>
    <p class="empty" id="empty">아직 퀘스트가 없어. 첫 모험을 시작해 볼까?</p>
    <div class="bulk-actions">
      <button id="clearCompleted" class="btn btn-clear" type="button" disabled>완료된 할 일 삭제</button>
      <button id="clearAll" class="btn btn-clear" type="button" disabled>전체 삭제</button>
    </div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </section>
</main>

<button class="resize-edge resize-bottom" data-resize="y" type="button" aria-label="창 높이 조절" title="아래 테두리를 위아래로 드래그하여 높이 조절"></button>
<button class="resize-edge resize-right" data-resize="x" type="button" aria-label="창 너비 조절" title="오른쪽 테두리를 좌우로 드래그하여 너비 조절"></button>
<button id="resizeHandle" data-resize="xy" class="resize-handle" type="button" aria-label="창 크기 조절" title="모서리를 드래그하여 너비와 높이 조절. 브라우저 영역 안에서만 커집니다.">◢</button>
<script src="game.js"></script>
<script src="todo.js"></script>
</body>
</html>
