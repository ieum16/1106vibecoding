<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘 할 일 작성기</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">TODAY</p>
      <h1>오늘 할 일</h1>
      <p id="remaining" class="remaining" aria-live="polite">남은 할 일 0개</p>
    </header>

    <section id="weather" class="weather" aria-live="polite" aria-label="서울 오늘 날씨">
      <span id="weather-icon" class="weather-icon" aria-hidden="true">⏳</span>
      <span id="weather-text" class="weather-text">불러오는 중…</span>
    </section>

    <form id="todo-form" novalidate>
      <label for="todo-input" class="sr-only">새 할 일</label>
      <div class="input-row">
        <input
          id="todo-input"
          type="text"
          maxlength="100"
          placeholder="할 일을 입력하세요"
          autocomplete="off"
          autofocus
        >
        <button type="submit" class="add-button">추가</button>
      </div>
      <p id="input-error" class="error" role="alert" aria-live="assertive"></p>
    </form>

    <ul id="todo-list" class="todo-list" aria-label="할 일 목록"></ul>
    <p id="empty-message" class="empty-message">할 일을 추가해 보세요.</p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
