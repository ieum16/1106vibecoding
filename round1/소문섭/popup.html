<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 할 일 라인업</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">TODAY’S LINEUP</p>
      <h1><img class="header-ball" src="icons/baseball.svg" alt="">오늘의 라인업</h1>
      <p class="subtitle">할 일 하나씩, 홈인해 볼까요?</p>
      <p id="remaining" class="remaining" aria-live="polite">남은 할 일 0개</p>
    </header>

    <form id="todo-form" novalidate>
      <label for="todo-input" class="sr-only">새 할 일</label>
      <div class="input-row">
        <input
          id="todo-input"
          type="text"
          maxlength="100"
          placeholder="오늘의 할 일을 적어 주세요"
          autocomplete="off"
          autofocus
        >
        <button type="submit" class="add-button" title="할 일을 라인업에 추가">추가</button>
      </div>
      <p id="input-error" class="error" role="alert" aria-live="assertive"></p>
    </form>

    <ul id="todo-list" class="todo-list" aria-label="할 일 목록"></ul>
    <p id="empty-message" class="empty-message"><img src="icons/baseball.svg" alt="" class="empty-ball">오늘의 첫 타자는 어떤 할 일인가요?<br><span>할 일을 추가하고 플레이볼!</span></p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
