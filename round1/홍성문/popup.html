<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>오늘 할 일</title><link rel="stylesheet" href="popup.css"></head><body><main>
<header><div><small>MY DAILY PLAN</small><h1>오늘 할 일</h1></div><button id="settings-toggle" aria-expanded="false" aria-controls="settings">설정</button></header>
<section id="settings" class="card" hidden aria-label="설정"><h2>나만의 테마</h2><label for="theme">배경과 색상</label><select id="theme"><option value="forest">숲 · 싱그러운 초록</option><option value="ocean">바다 · 시원한 파랑</option><option value="lavender">라벤더 · 부드러운 보라</option><option value="sunset">노을 · 따뜻한 살구</option><option value="night">밤 · 차분한 어두운 화면</option></select><h2>Google 일정 연동</h2><p class="hint">기본 Google 캘린더의 오늘 일정을 가져옵니다. Gmail에서 캘린더에 등록된 예약도 포함하며, 메일함을 직접 읽지는 않습니다.</p><p id="google-config" class="hint"></p><div class="actions"><button id="google-connect">Google 연결 및 가져오기</button><button id="google-disconnect">연결 해제</button></div><label class="check-label"><input id="auto-sync" type="checkbox">창을 열 때 오늘 일정 자동 갱신</label><p class="hint">완료·삭제는 Google 원본에 반영하지 않습니다. 연결 해제 후에도 가져온 일정은 남습니다.</p></section>
<div class="day-picker"><label for="view-date">일정 날짜</label><input id="view-date" type="date" required><button id="today-button">오늘</button></div><p id="remaining" class="remaining" aria-live="polite"></p>
<form id="todo-form" class="card"><label for="todo-input">새 일정</label><input id="todo-input" maxlength="100" placeholder="어떤 일을 할까요?" required autocomplete="off"><div class="input-row"><div><label for="todo-time">시간 (선택)</label><input id="todo-time" type="time"></div><button class="primary" type="submit">일정 추가</button></div><p class="hint">선택한 날짜에 추가됩니다. 시간은 목록에서도 바꿀 수 있어요.</p></form>
<p id="status" role="status" aria-live="polite"></p><div id="todo-groups"></div><p id="empty-message" class="empty-message">이날의 첫 일정을 추가해 보세요.</p></main><script src="schedule.js"></script><script src="popup.js"></script></body></html>
