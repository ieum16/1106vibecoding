<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘 할 일 작성기</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">TODAY</p>
      <h1>오늘 할 일</h1>
      <p id="remaining" class="remaining" aria-live="polite">남은 할 일 0개</p>
    </header>

    <form id="todo-form" novalidate>
      <label for="todo-input" class="sr-only">새 할 일</label>
      <div class="input-row">
        <input
          id="todo-input"
          type="text"
          maxlength="100"
          placeholder="할 일을 입력하세요"
          autocomplete="off"
          autofocus
        >
        <button type="submit" class="add-button">추가</button>
      </div>
      <div class="options"><label>마감일 (선택)<input id="due" type="date"></label><label>중요도<select id="priority"><option value="normal">보통</option><option value="high">높음</option><option value="low">낮음</option></select></label></div>
      <p id="input-error" class="error" role="alert" aria-live="assertive"></p>
    </form>

    <div class="filters" aria-label="목록 필터"><button type="button" data-filter="all" aria-pressed="true">전체</button><button type="button" data-filter="active" aria-pressed="false">미완료</button><button type="button" data-filter="completed" aria-pressed="false">완료</button></div>
    <ul id="todo-list" class="todo-list" aria-label="할 일 목록"></ul>
    <p id="empty-message" class="empty-message">할 일을 추가해 보세요.</p>
  </main>

  <script src="popup.js"></script>
</body>
</html>
