<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>유튜브 로컬 다운로드</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <p class="eyebrow">VIDEO TO YOUR MAC</p>
    <h1>유튜브 다운로드</h1>
    <p class="intro">영상 링크 하나로, 내 컴퓨터에 저장하세요.</p>
    <form id="download-form">
      <label for="url">영상 URL</label>
      <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=…" required autocomplete="off">
      <button id="current-tab" type="button" class="secondary">현재 탭 URL 가져오기</button>
      <button id="download" type="submit">다운로드 시작</button>
    </form>
    <section aria-label="다운로드 상태" aria-live="polite">
      <p id="status">영상 URL을 입력해 주세요.</p>
      <progress id="progress" max="100" value="0" aria-label="영상 다운로드 진행률"></progress>
      <p id="detail"></p>
      <p id="file"></p>
    </section>
    <p class="note">저장 위치: 크롬 다운로드 폴더의 YouTube 폴더<br>다운로드 시작 후 팝업을 닫아도 저장은 계속됩니다.</p>
    <p class="setup">영상·음성이 합쳐진 직접 저장 가능한 MP4만 지원합니다. 분리된 영상이나 주소 해독이 필요한 영상은 지원하지 않습니다.</p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
